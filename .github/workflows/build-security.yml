# Person B pipeline: build and runtime security
#
# Jobs:
#   iac_scan  Task 1: Dockerfile and IaC scanning (Hadolint, Checkov)
#   sca       Task 2: vulnerable dependencies (Trivy, npm audit)
#   sbom      Task 3: software bill of materials (Syft, CycloneDX)
# Later tasks add: image build + scan, signing, DAST.
#
# Rules (team handover):
#   - Observe first, then block: every check runs in report mode for now.
#     See the "GATE" comments for the switch that makes it fail the build.
#   - Actions pinned by commit SHA, images pinned by digest, never by tag.
#   - Least privilege: read only by default, each job asks for what it needs.

name: Build Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run of the same branch / PR when a new commit is pushed
concurrency:
  group: build-security-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.29@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a

jobs:
  # ---------------------------------------------------------------------------
  # Task 1: Dockerfile linting (Hadolint) + IaC scanning (Checkov)
  # Scans: Dockerfile, infrastructure/Dockerfile, terraform/, infrastructure/terraform/
  # ---------------------------------------------------------------------------
  iac_scan:
    name: iac_scan (Hadolint + Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile best practices)
        # GATE: remove --no-fail and add --failure-threshold error to block the build.
        run: |
          mkdir -p reports
          # Readable output in the job log
          docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" \
            /bin/hadolint --no-fail Dockerfile infrastructure/Dockerfile
          # SARIF for the Security tab
          docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" \
            /bin/hadolint --no-fail -f sarif Dockerfile infrastructure/Dockerfile \
            > reports/hadolint.sarif

      - name: Checkov (Dockerfile, Terraform, secrets)
        # GATE: remove --soft-fail (or use --soft-fail-on LOW,MEDIUM) to block the build.
        # Writes reports/results_cli.txt and reports/results_sarif.sarif
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            -d . --framework dockerfile,secrets,terraform \
            -o cli -o sarif --output-file-path reports \
            --soft-fail --quiet --compact
          cat reports/results_cli.txt

      - name: Upload Hadolint results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint

      - name: Upload Checkov results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/results_sarif.sarif
          category: checkov

      - name: Keep the reports as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iac-scan-reports
          path: reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Task 2: SCA, vulnerable third-party dependencies (Trivy + npm audit)
  #
  # Juice Shop ships WITHOUT a lockfile (.npmrc: package-lock=false), so the
  # dependency tree is resolved fresh at every install. That is a supply chain
  # weakness on its own (builds are not reproducible). Both scanners need a
  # lockfile, so we generate one first, without installing anything and
  # without running install scripts.
  # ---------------------------------------------------------------------------
  sca:
    name: sca (Trivy + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve dependency tree (generate lockfiles, no install)
        # --package-lock-only : write package-lock.json, do not download packages
        # --ignore-scripts    : never run third-party install scripts in CI
        run: |
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund
          cd frontend
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Trivy filesystem scan (HIGH, CRITICAL)
        # GATE: change --exit-code 0 to --exit-code 1 (and --severity CRITICAL)
        # in the table step to fail the build on critical vulnerabilities.
        run: |
          mkdir -p reports "$RUNNER_TEMP/trivy-cache"
          # Shared cache: the vulnerability database is downloaded only once
          trivy() {
            docker run --rm -v "$PWD:/src" -w /src \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }
          # Readable table in the job log
          trivy fs --scanners vuln --severity HIGH,CRITICAL \
            --format table --exit-code 0 .
          # SARIF for the Security tab, JSON (all severities) for the comparison table
          trivy fs --scanners vuln --severity HIGH,CRITICAL --skip-db-update \
            --format sarif --output reports/trivy-fs.sarif .
          trivy fs --scanners vuln --skip-db-update \
            --format json --output reports/trivy-fs.json .

      - name: npm audit (second opinion, for the tool comparison)
        # GATE: remove "|| true" to fail the build at --audit-level=high.
        run: |
          echo "### Backend (production dependencies)"
          npm audit --omit=dev --audit-level=high || true
          npm audit --omit=dev --json > reports/npm-audit-backend.json || true
          echo "### Frontend"
          cd frontend
          npm audit --audit-level=high || true
          npm audit --json > ../reports/npm-audit-frontend.json || true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

      - name: Keep the reports and generated lockfiles as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-reports
          path: |
            reports/
            package-lock.json
            frontend/package-lock.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Task 3: SBOM, inventory of every component (Syft, CycloneDX JSON)
  #
  # Same lockfile step as the sca job: without it Syft only sees 4 components
  # (the GitHub Actions in the workflow files) instead of ~1,170 npm packages.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom (Syft, CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve dependency tree (generate lockfiles, no install)
        run: |
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund
          cd frontend
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Generate SBOM with Syft
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SYFT_IMAGE" \
            dir:. --source-name juice-shop --source-version "$GITHUB_SHA" \
            -o cyclonedx-json=sbom.cdx.json
          echo "Components in the SBOM:"
          jq '.components | length' sbom.cdx.json

      - name: Scan the SBOM with Trivy (bonus)
        # Vulnerability scan from the inventory alone, no source code needed.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            sbom --severity HIGH,CRITICAL --format table --exit-code 0 \
            sbom.cdx.json

      - name: Keep the SBOM as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
