# Person B pipeline: build and runtime security
#
# Jobs:
#   iac_scan  Task 1: Dockerfile and IaC scanning (Hadolint, Checkov)
#   sca       Task 2: vulnerable dependencies (Trivy, npm audit)
#   sbom      Task 3: software bill of materials (Syft, CycloneDX)
#   image     Task 4: build the container image, scan it (Trivy), push to GHCR
#   sign      Task 5: sign the image by digest and verify it (Cosign)
#   dast      Task 6: attack the running app with OWASP ZAP (baseline scan)
#
# Rules (team handover):
#   - Observe first, then block: every check runs in report mode for now.
#     See the "GATE" comments for the switch that makes it fail the build.
#   - Actions pinned by commit SHA, images pinned by digest, never by tag.
#   - Least privilege: read only by default, each job asks for what it needs.

name: Build Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run of the same branch / PR when a new commit is pushed
concurrency:
  group: build-security-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.29@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
  # Our own image in GitHub Container Registry (repository name is lowercase)
  APP_IMAGE: ghcr.io/${{ github.repository }}/juice-shop
  COSIGN_VERSION: v3.1.4
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  # ---------------------------------------------------------------------------
  # Task 1: Dockerfile linting (Hadolint) + IaC scanning (Checkov)
  # Scans: Dockerfile, infrastructure/Dockerfile, terraform/, infrastructure/terraform/
  # ---------------------------------------------------------------------------
  iac_scan:
    name: iac_scan (Hadolint + Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile best practices)
        # GATE: remove --no-fail and add --failure-threshold error to block the build.
        run: |
          mkdir -p reports
          # Readable output in the job log
          docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" \
            /bin/hadolint --no-fail Dockerfile infrastructure/Dockerfile
          # SARIF for the Security tab
          docker run --rm -v "$PWD:/src" -w /src "$HADOLINT_IMAGE" \
            /bin/hadolint --no-fail -f sarif Dockerfile infrastructure/Dockerfile \
            > reports/hadolint.sarif

      - name: Checkov (Dockerfile, Terraform, secrets)
        # GATE: remove --soft-fail (or use --soft-fail-on LOW,MEDIUM) to block the build.
        # Writes reports/results_cli.txt and reports/results_sarif.sarif
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            -d . --framework dockerfile,secrets,terraform \
            -o cli -o sarif --output-file-path reports \
            --soft-fail --quiet --compact
          cat reports/results_cli.txt

      - name: Upload Hadolint results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint

      - name: Upload Checkov results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/results_sarif.sarif
          category: checkov

      - name: Keep the reports as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iac-scan-reports
          path: reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Task 2: SCA, vulnerable third-party dependencies (Trivy + npm audit)
  #
  # Juice Shop ships WITHOUT a lockfile (.npmrc: package-lock=false), so the
  # dependency tree is resolved fresh at every install. That is a supply chain
  # weakness on its own (builds are not reproducible). Both scanners need a
  # lockfile, so we generate one first, without installing anything and
  # without running install scripts.
  # ---------------------------------------------------------------------------
  sca:
    name: sca (Trivy + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve dependency tree (generate lockfiles, no install)
        # --package-lock-only : write package-lock.json, do not download packages
        # --ignore-scripts    : never run third-party install scripts in CI
        run: |
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund
          cd frontend
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Trivy filesystem scan (HIGH, CRITICAL)
        # GATE: change --exit-code 0 to --exit-code 1 (and --severity CRITICAL)
        # in the table step to fail the build on critical vulnerabilities.
        run: |
          mkdir -p reports "$RUNNER_TEMP/trivy-cache"
          # Shared cache: the vulnerability database is downloaded only once
          trivy() {
            docker run --rm -v "$PWD:/src" -w /src \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }
          # Readable table in the job log
          trivy fs --scanners vuln --severity HIGH,CRITICAL \
            --format table --exit-code 0 .
          # SARIF for the Security tab, JSON (all severities) for the comparison table
          trivy fs --scanners vuln --severity HIGH,CRITICAL --skip-db-update \
            --format sarif --output reports/trivy-fs.sarif .
          trivy fs --scanners vuln --skip-db-update \
            --format json --output reports/trivy-fs.json .

      - name: npm audit (second opinion, for the tool comparison)
        # GATE: remove "|| true" to fail the build at --audit-level=high.
        run: |
          echo "### Backend (production dependencies)"
          npm audit --omit=dev --audit-level=high || true
          npm audit --omit=dev --json > reports/npm-audit-backend.json || true
          echo "### Frontend"
          cd frontend
          npm audit --audit-level=high || true
          npm audit --json > ../reports/npm-audit-frontend.json || true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

      - name: Keep the reports and generated lockfiles as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-reports
          path: |
            reports/
            package-lock.json
            frontend/package-lock.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Task 3: SBOM, inventory of every component (Syft, CycloneDX JSON)
  #
  # Same lockfile step as the sca job: without it Syft only sees 4 components
  # (the GitHub Actions in the workflow files) instead of ~1,170 npm packages.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom (Syft, CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve dependency tree (generate lockfiles, no install)
        run: |
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund
          cd frontend
          npm install --package-lock-only --package-lock=true \
            --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Generate SBOM with Syft
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SYFT_IMAGE" \
            dir:. --source-name juice-shop --source-version "$GITHUB_SHA" \
            -o cyclonedx-json=sbom.cdx.json
          echo "Components in the SBOM:"
          jq '.components | length' sbom.cdx.json

      - name: Scan the SBOM with Trivy (bonus)
        # Vulnerability scan from the inventory alone, no source code needed.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            sbom --severity HIGH,CRITICAL --format table --exit-code 0 \
            sbom.cdx.json

      - name: Keep the SBOM as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Task 4: container build, image scan, push to GitHub Container Registry
  #
  # The image adds OS packages and layers that the source scan cannot see.
  # Order: build -> scan -> push, so that once the gate is on, a vulnerable
  # image never reaches the registry. Tagged with the commit SHA (traceable,
  # never overwritten); the digest is exported for signing (Task 5).
  # ---------------------------------------------------------------------------
  image:
    name: image (build, Trivy scan, push to GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's own short-lived token
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (tagged with the commit SHA)
        # Full Juice Shop build (backend + Angular frontend): about 10 minutes.
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$APP_IMAGE:$GITHUB_SHA" .
          docker image ls "$APP_IMAGE"

      - name: Trivy image scan (HIGH, CRITICAL)
        # The image is exported to a tar file and scanned offline, so Trivy
        # never gets access to the Docker socket (that would be root on the runner).
        # GATE: change --exit-code 0 to --exit-code 1 in the table step
        # (with --severity CRITICAL --ignore-unfixed) to stop before the push.
        run: |
          mkdir -p reports "$RUNNER_TEMP/trivy-cache"
          docker save "$APP_IMAGE:$GITHUB_SHA" -o "$RUNNER_TEMP/image.tar"
          trivy() {
            docker run --rm -v "$PWD:/src" -w /src \
              -v "$RUNNER_TEMP:/scan:ro" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }
          # Readable table in the job log
          trivy image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --format table --exit-code 0
          # SARIF for the Security tab, JSON (all severities) for the report
          trivy image --input /scan/image.tar --scanners vuln --skip-db-update \
            --severity HIGH,CRITICAL --format sarif --output reports/trivy-image.sarif
          trivy image --input /scan/image.tar --scanners vuln --skip-db-update \
            --format json --output reports/trivy-image.json
          rm -f "$RUNNER_TEMP/image.tar"

      - name: Push image to GHCR
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$APP_IMAGE:$GITHUB_SHA"
          # The digest identifies the exact image content; Task 5 signs this, not the tag
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$APP_IMAGE:$GITHUB_SHA")
          digest="${ref#*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Image pushed"
            echo "- Tag: \`$APP_IMAGE:$GITHUB_SHA\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

      - name: Keep the image scan reports as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-reports
          path: reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Task 5: image signing and verification with Cosign
  #
  # Proves that the image we deploy is the one this pipeline built and that it
  # was not modified afterwards. We sign the DIGEST (the content hash), never
  # the tag, because a tag can be moved to another image.
  #
  # Keys: generated once with `cosign generate-key-pair`.
  #   cosign.key + its password -> repository secrets COSIGN_PRIVATE_KEY and
  #                                COSIGN_PASSWORD (never committed)
  #   cosign.pub                -> committed at the repository root
  # The private key is read from an environment variable (env://), so it is
  # never written to the runner's disk.
  # ---------------------------------------------------------------------------
  sign:
    name: sign (Cosign sign + verify)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the signature next to the image in GHCR
    steps:
      - name: Checkout (for cosign.pub)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign (checksum verified)
        run: |
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          curl -sSfL -o cosign-linux-amd64 "$base/cosign-linux-amd64"
          curl -sSfL -o cosign_checksums.txt "$base/cosign_checksums.txt"
          grep -E " cosign-linux-amd64$" cosign_checksums.txt | sha256sum --check
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
          rm cosign-linux-amd64 cosign_checksums.txt
          cosign version

      - name: Check that the signing secrets exist
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "::error::Repository secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD are not set"
            exit 1
          fi
          test -f cosign.pub || { echo "::error::cosign.pub is missing from the repository"; exit 1; }

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Sign the image by digest
        # Also records the signature in the public Sigstore transparency log (Rekor),
        # so anyone can audit when this image was signed.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "Signing $APP_IMAGE@$DIGEST"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$APP_IMAGE@$DIGEST"

      - name: Verify the signature (fails the build if it is missing or invalid)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cosign verify --key cosign.pub "$APP_IMAGE@$DIGEST" | jq .
          {
            echo "### Image signed and verified"
            echo "- Image: \`$APP_IMAGE@$DIGEST\`"
            echo "- Verified with \`cosign.pub\` from the repository"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Negative test, an image we did not sign must be rejected
        # The upstream Juice Shop image from Docker Hub was not signed with our key,
        # so verification has to fail. If it passed, the check would be worthless.
        # It must fail for the RIGHT reason ("no signatures found"), not because of a
        # network error or a registry rate limit, otherwise the test proves nothing.
        run: |
          if out=$(cosign verify --key cosign.pub docker.io/bkimminich/juice-shop:latest 2>&1); then
            echo "$out"
            echo "::error::An image that we did not sign passed verification"
            exit 1
          fi
          echo "$out"
          if ! grep -q "no signatures found" <<< "$out"; then
            echo "::error::Verification failed for an unexpected reason (see the output above)"
            exit 1
          fi
          echo "As expected: the unsigned upstream image was rejected."
          echo "- Unsigned upstream image \`bkimminich/juice-shop\`: rejected as expected" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # ---------------------------------------------------------------------------
  # Task 6: DAST, attack the running application with OWASP ZAP
  #
  # Finds what static tools cannot see: missing security headers, exposed
  # paths, cookies, runtime error pages. Runs only after the image has been
  # signed and verified, against that exact image (by digest).
  #
  # Baseline mode only (passive: spiders the app and inspects the responses,
  # no attack payloads), and only against the container started inside this
  # job on localhost. Never point this job at any other host.
  # ---------------------------------------------------------------------------
  dast:
    name: dast (OWASP ZAP baseline)
    needs: [image, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull our image from GHCR
    steps:
      - name: Pull the signed image from GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$APP_IMAGE@$DIGEST"
          docker logout ghcr.io

      - name: Start Juice Shop and wait until it answers on port 3000
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker run -d --name juice -p 127.0.0.1:3000:3000 "$APP_IMAGE@$DIGEST"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000; then
              echo "Juice Shop is up after $((i * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Juice Shop did not start within 2 minutes"
          docker logs juice
          exit 1

      - name: ZAP baseline scan
        # Exit codes: 0 = no alerts, 1 = FAIL alerts, 2 = WARN alerts only, 3 = error.
        # GATE: after tuning the rules, fail the build on exit code 1 (FAIL alerts).
        run: |
          mkdir -p zap && chmod 777 zap # the ZAP container runs as user "zap"
          set +e
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:3000 \
            -r zap-report.html -J zap-report.json -w zap-report.md -I
          code=$?
          set -e
          echo "ZAP exit code: $code"
          if [ "$code" -eq 3 ]; then
            echo "::error::ZAP failed to run the scan"
            exit 1
          fi
          {
            echo "### ZAP baseline scan (exit code $code)"
            cat zap/zap-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Juice Shop
        if: always()
        run: docker rm -f juice || true

      - name: Keep the ZAP reports as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: zap/
          retention-days: 30
