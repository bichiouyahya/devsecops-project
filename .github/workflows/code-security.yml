# Person A pipeline: code security (secrets, SAST, security unit tests)
name: Code Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read only by default, each job asks for what it needs
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  SEMGREP_VERSION: 1.183.0

jobs:
  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      # Actions pinned by commit SHA, not by tag (supply chain rule from the course)
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan every commit, not only the last one

      - name: Install Gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan Git history
        # Blocking mode: any secret not triaged in .gitleaksignore fails the build.
        # Test fixtures are excluded in .gitleaks.toml.
        run: |
          gitleaks git . --config .gitleaks.toml --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep (pinned version)
        run: |
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep --version

      - name: Scan source code
        # Observe mode: Semgrep exits 0 without --error, so findings are reported, not blocking.
        # Blocking mode (after triage): add  --error --severity ERROR
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejsscan \
            --config p/owasp-top-ten \
            --metrics off \
            --sarif --output semgrep.sarif \
            --text-output semgrep.txt

      - name: Show summary
        if: always()
        run: tail -n 40 semgrep.txt || true

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.txt

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended   # broader security query suite

      - name: Analyze
        uses: github/codeql-action/analyze@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2
        with:
          category: codeql

  sast-sonarqube:
    name: SAST (SonarQube Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # SonarQube needs the history to tell new code from old code
          persist-credentials: false

      - name: SonarQube Cloud scan
        # Settings (organization, project key, exclusions) are in sonar-project.properties.
        # Quality gate "Sonar way" on new code. On pull requests the job waits for the
        # gate result and fails if the gate fails, so this check can be required on main.
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600' || '' }}

  security-tests:
    name: Security unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install backend dependencies
        # Juice Shop has no lockfile, so npm install (not npm ci).
        # --ignore-scripts skips the postinstall that builds the Angular frontend:
        # these API tests do not need the UI, and that build crashes npm on CI.
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm rebuild sqlite3

      - name: Build server
        run: npx tsc

      - name: Create placeholder frontend files
        # The server checks at startup that these files exist. API tests never load them.
        run: |
          d=frontend/dist/frontend
          mkdir -p "$d"
          for f in index.html styles.css main.js polyfills.js hacking-instructor-placeholder.js; do
            echo "" > "$d/$f"
          done

      - name: Run security tests
        # Observe mode: the tests prove the flaws exist, so they fail until the Task 7 fixes.
        # Remove continue-on-error once they pass, then make this check required.
        continue-on-error: true
        run: |
          node --import ./test/api/helpers/test-env.mjs --import tsx --test --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=security-tests.xml \
            test/security/security.test.ts

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-tests-report
          path: security-tests.xml

  # ---------------------------------------------------------------------------
  # Notification (brief §6): email the team when any job of this run fails.
  # Sent with curl over SMTP with STARTTLS required: no third-party action, and
  # the password never travels in clear text. The job has no GitHub token at
  # all (permissions: {}). Secrets: SMTP_USERNAME, SMTP_PASSWORD (an app
  # password, not the account password), NOTIFY_EMAIL_TO (comma-separated);
  # the addresses are secrets so they stay out of this public repo and its logs.
  # ---------------------------------------------------------------------------
  notify:
    name: Notify on failure (email)
    needs: [secrets, sast-semgrep, sast-codeql, sast-sonarqube, security-tests]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send failure email
        env:
          SMTP_SERVER: smtp.gmail.com:587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$NOTIFY_EMAIL_TO" ]; then
            echo "::warning::Email secrets are not set: no notification sent"
            exit 0
          fi
          # Jobs of this run that failed (from the needs context)
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | "  - " + .key' <<< "$NEEDS")
          # Single-line values only, so nothing can be injected into the mail headers
          ref=$(printf '%s' "$REF_NAME" | tr -d '\r\n')
          title=$(printf '%s' "$PR_TITLE" | tr -d '\r\n')
          {
            echo "From: DevSecOps pipeline <$SMTP_USERNAME>"
            echo "To: $NOTIFY_EMAIL_TO"
            echo "Subject: [FAILED] $WORKFLOW on $ref"
            echo "Date: $(date -R)"
            echo "MIME-Version: 1.0"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo
            echo "The \"$WORKFLOW\" pipeline failed."
            echo
            echo "Repository: $REPOSITORY"
            echo "Branch:     $ref"
            [ -n "$title" ] && echo "Pull request: $title"
            echo "Event:      $EVENT, by $ACTOR"
            echo "Commit:     $SHA"
            echo
            echo "Failed job(s):"
            echo "$failed"
            echo
            echo "Logs and reports: $RUN_URL"
          } > mail.txt
          # One --mail-rcpt per address in NOTIFY_EMAIL_TO (comma-separated)
          rcpt=()
          count=0
          IFS=',' read -ra addrs <<< "$NOTIFY_EMAIL_TO"
          for a in "${addrs[@]}"; do
            a=$(printf '%s' "$a" | tr -d '[:space:]')
            if [ -n "$a" ]; then
              rcpt+=(--mail-rcpt "$a")
              count=$((count + 1))
            fi
          done
          # SMTP with STARTTLS required: the password is never sent in clear text
          curl --silent --show-error --ssl-reqd \
            --url "smtp://$SMTP_SERVER" \
            --user "$SMTP_USERNAME:$SMTP_PASSWORD" \
            --mail-from "$SMTP_USERNAME" "${rcpt[@]}" \
            --upload-file mail.txt
          echo "Failure email sent to $count recipient(s)."
