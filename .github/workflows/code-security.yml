# Person A pipeline: code security (secrets now, SAST and tests added in later tasks)
name: Code Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read only by default, each job asks for what it needs
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      # Actions pinned by commit SHA, not by tag (supply chain rule from the course)
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan every commit, not only the last one

      - name: Install Gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan Git history
        # Blocking mode: any secret not triaged in .gitleaksignore fails the build.
        # Test fixtures are excluded in .gitleaks.toml.
        run: |
          gitleaks git . --config .gitleaks.toml --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
