# Staging namespace for Juice Shop, deployed by the deploy_staging job
# (.github/workflows/build-security.yml) into an ephemeral kind cluster.
#
# Pod Security Admission "restricted": the API server itself refuses any pod
# that runs as root, allows privilege escalation, keeps Linux capabilities or
# has no seccomp profile. A second line of defence behind the manifest review.
apiVersion: v1
kind: Namespace
metadata:
  name: juice-shop-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
