# Internal Service only (ClusterIP): Juice Shop is never exposed outside the
# cluster. The deploy_staging job reaches it with kubectl port-forward on the
# runner's 127.0.0.1 for the ZAP scan.
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop-staging
  labels:
    app: juice-shop
spec:
  type: ClusterIP
  selector:
    app: juice-shop
  ports:
    - name: http
      port: 3000
      targetPort: http
