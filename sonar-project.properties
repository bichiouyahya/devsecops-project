# SonarQube Cloud settings for the "SAST (SonarQube Cloud)" job in
# .github/workflows/code-security.yml
#
# Organization and project keys: check them on sonarcloud.io after importing
# the repository (project page > Information) and adjust if they differ.
sonar.organization=bichiouyahya
sonar.projectKey=bichiouyahya_devsecops-project
sonar.projectName=devsecops-project (OWASP Juice Shop)

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Not our source code: dependencies, build output, tests, seed data, docs,
# translations and generated reports.
sonar.exclusions=\
  node_modules/**,\
  frontend/node_modules/**,\
  frontend/dist/**,\
  build/**,\
  dist/**,\
  test/**,\
  **/*.spec.ts,\
  cypress/**,\
  data/static/**,\
  frontend/src/assets/i18n/**,\
  docs/**,\
  screenshots/**,\
  vagrant/**
